name: Build Monev Alarm APK (20.00 & 22.00 - Wajib SS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate & Compile Native Android Alarm APK
        run: |
          set -e
          rm -rf build_apk
          mkdir -p build_apk/src/id/maganghub/monevreminder
          mkdir -p build_apk/assets
          mkdir -p build_apk/classes
          mkdir -p build_apk/dex

          cat << 'MANIFEST_EOF' > build_apk/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="id.maganghub.monevreminder"
              android:versionCode="2"
              android:versionName="2.0.0">

              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:label="Alarm Monev (Wajib SS)"
                  android:icon="@android:drawable/ic_lock_idle_alarm"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Light.NoTitleBar">

                  <activity
                      android:name="id.maganghub.monevreminder.MainActivity"
                      android:exported="true"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name="id.maganghub.monevreminder.AlarmReceiver"
                      android:exported="false" />

                  <receiver
                      android:name="id.maganghub.monevreminder.BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          MANIFEST_EOF

          cat << 'MAIN_JAVA_EOF' > build_apk/src/id/maganghub/monevreminder/MainActivity.java
          package id.maganghub.monevreminder;

          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.Calendar;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_RESULT_CODE = 2001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().addFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON |
                      WindowManager.LayoutParams.FLAG_ALLOW_LOCK_WHILE_SCREEN_ON
                  );

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 100);
                  }

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl().toString());
                      }
                      @Override
                      @SuppressWarnings("deprecation")
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleUrl(url);
                      }
                      private boolean handleUrl(String url) {
                          if (url.contains("maganghub.kemnaker.go.id") || url.startsWith("https://wa.me/")) {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              return true;
                          }
                          return false;
                      }
                  });

                  // Mendukung pemilih file gambar (Screenshot / SS) dari Galeri HP Android
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("image/*");
                          startActivityForResult(Intent.createChooser(intent, "Pilih Screenshot (SS) Bukti Monev"), FILE_CHOOSER_RESULT_CODE);
                          return true;
                      }
                  });

                  scheduleAllDailyAlarms(this);

                  boolean ringNow = getIntent() != null && getIntent().getBooleanExtra("RING_ALARM", false);
                  String slot = getIntent() != null ? getIntent().getStringExtra("SLOT_ID") : "";
                  if (ringNow) {
                      webView.loadUrl("file:///android_asset/index.html?ring=1&slot=" + (slot != null ? slot : "malam_2000"));
                  } else {
                      webView.loadUrl("file:///android_asset/index.html");
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null && data.getDataString() != null) {
                          results = new Uri[]{Uri.parse(data.getDataString())};
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }

              @Override
              public void onBackPressed() {
                  // Cegah tombol Back menutup aplikasi saat alarm berbunyi
              }

              public static void scheduleAllDailyAlarms(Context context) {
                  scheduleDaily(context, 201, 20, 0, "malam_2000", "Alarm Monev 20:00 WIB");
                  scheduleDaily(context, 202, 22, 0, "malam_2200", "Alarm Monev 22:00 WIB");
              }

              private static void scheduleDaily(Context context, int requestCode, int hour, int minute, String slotId, String label) {
                  AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  Intent intent = new Intent(context, AlarmReceiver.class);
                  intent.putExtra("SLOT_ID", slotId);
                  intent.putExtra("SESSION_LABEL", label);
                  PendingIntent pi = PendingIntent.getBroadcast(
                      context, requestCode, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
                  Calendar cal = Calendar.getInstance();
                  cal.set(Calendar.HOUR_OF_DAY, hour);
                  cal.set(Calendar.MINUTE, minute);
                  cal.set(Calendar.SECOND, 0);
                  if (cal.getTimeInMillis() <= System.currentTimeMillis()) {
                      cal.add(Calendar.DAY_OF_YEAR, 1);
                  }
                  am.setRepeating(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), AlarmManager.INTERVAL_DAY, pi);
              }
          }
          MAIN_JAVA_EOF

          cat << 'ALARM_JAVA_EOF' > build_apk/src/id/maganghub/monevreminder/AlarmReceiver.java
          package id.maganghub.monevreminder;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          public class AlarmReceiver extends BroadcastReceiver {
              private static final String CHANNEL_ID = "monev_strict_alarm_channel";

              @Override
              public void onReceive(Context context, Intent intent) {
                  String slotId = intent.getStringExtra("SLOT_ID");
                  String sessionLabel = intent.getStringExtra("SESSION_LABEL");
                  if (sessionLabel == null) sessionLabel = "Alarm Monev (20:00 / 22:00)";

                  Intent launchIntent = new Intent(context, MainActivity.class);
                  launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  launchIntent.putExtra("RING_ALARM", true);
                  launchIntent.putExtra("SLOT_ID", slotId != null ? slotId : "malam_2000");

                  PendingIntent pi = PendingIntent.getActivity(
                      context, (int) System.currentTimeMillis(), launchIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  Notification.Builder builder;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm != null) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID, "Alarm Wajib SS Monev MagangHub", NotificationManager.IMPORTANCE_HIGH
                      );
                      nm.createNotificationChannel(channel);
                      builder = new Notification.Builder(context, CHANNEL_ID);
                  } else {
                      builder = new Notification.Builder(context);
                  }

                  builder.setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                         .setContentTitle("🚨 " + sessionLabel + " — WAJIB UPLOAD SS!")
                         .setContentText("Alarm tidak akan berhenti sebelum Anda upload Screenshot bukti isi Monev!")
                         .setOngoing(true)
                         .setAutoCancel(false)
                         .setContentIntent(pi);

                  if (nm != null) {
                      nm.notify(999, builder.build());
                  }

                  try {
                      context.startActivity(launchIntent);
                  } catch (Exception ignored) {
                  }
              }
          }
          ALARM_JAVA_EOF

          cat << 'BOOT_JAVA_EOF' > build_apk/src/id/maganghub/monevreminder/BootReceiver.java
          package id.maganghub.monevreminder;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      MainActivity.scheduleAllDailyAlarms(context);
                  }
              }
          }
          BOOT_JAVA_EOF

          sed -i 's/^          //' build_apk/AndroidManifest.xml

          cat << 'APK_HTML_EOF' > build_apk/assets/index.html
          <!DOCTYPE html>
          <html lang="id">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1.0">
            <title>Alarm Monev 20:00 & 22:00 (Wajib SS)</title>
            <style>
              *{box-sizing:border-box}
              body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#f8fafc;margin:0;padding:16px}
              .header{background:linear-gradient(135deg,#991b1b,#dc2626,#ea580c);color:#fff;padding:20px;border-radius:18px;margin-bottom:16px;box-shadow:0 6px 20px rgba(220,38,38,0.35)}
              .badge{display:inline-block;background:rgba(0,0,0,0.3);padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800}
              .clock-box{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.28);padding:12px 14px;border-radius:12px;margin-top:12px}
              .card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px;margin-bottom:12px}
              .card.done{border-color:#10b981;background:#064e3b}
              .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
              .time{font-size:32px;font-weight:900;color:#fff;margin:6px 0}
              .desc{font-size:12px;color:#cbd5e1;margin:0 0 12px 0;line-height:1.4}
              .btn{display:block;width:100%;padding:12px;border-radius:12px;text-decoration:none;font-weight:800;font-size:13px;border:none;cursor:pointer;text-align:center}
              .btn-red{background:#dc2626;color:#fff}
              .btn-green{background:#059669;color:#fff}
              .btn-dark{background:#334155;color:#fff;margin-top:10px}
              .pill{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:rgba(245,158,11,0.2);color:#fcd34d}
              .pill.ok{background:rgba(16,185,129,0.25);color:#6ee7b7}
              #alarmOverlay{display:none;position:fixed;inset:0;z-index:999;padding:18px;background:#7f1d1d;overflow-y:auto;animation:flashBg 0.8s infinite alternate}
              @keyframes flashBg{0%{background:#7f1d1d}100%{background:#0f172a}}
              .modal-box{background:#0f172a;border:3px solid #ef4444;border-radius:22px;padding:20px;max-width:440px;margin:20px auto;color:#fff}
              input[type=file]{width:100%;background:#020617;color:#e2e8f0;padding:10px;border-radius:12px;border:1px solid #475569;font-size:12px;margin:10px 0}
              img.preview{max-height:160px;display:block;margin:10px auto;border-radius:10px;border:2px solid #10b981}
            </style>
          </head>
          <body>
            <div class="header">
              <span class="badge">WAJIB UPLOAD SCREENSHOT (SS)</span>
              <h2 style="margin:8px 0 4px 0;font-size:20px">Alarm Monev MagangHub</h2>
              <div style="font-size:12px;opacity:0.9">Berbunyi pukul 20:00 & 22:00 WIB • Tidak berhenti sebelum setor SS</div>
              <div class="clock-box">
                <div>
                  <div style="font-size:10px;opacity:0.8">WAKTU SEKARANG</div>
                  <div id="clock" style="font-size:18px;font-weight:900">--:--:-- WIB</div>
                </div>
                <div style="text-align:right">
                  <div style="font-size:10px;opacity:0.8">ALARM BERIKUTNYA</div>
                  <div id="nextTimer" style="font-size:18px;font-weight:900;color:#fde68a">--:--:--</div>
                </div>
              </div>
            </div>

            <button class="btn btn-red" style="margin-bottom:12px" onclick="startAlarm('Alarm Tes (Wajib SS)')">
              🔊 Tes Bunyi Sirine & Kunci SS Sekarang
            </button>

            <div id="cards"></div>

            <div class="card">
              <strong style="font-size:13px">Setor Bukti SS Lebih Awal (Sebelum 20:00)</strong>
              <p class="desc" style="margin-top:4px">Jika sudah isi Monev sore/malam ini, unggah SS di bawah agar alarm 20:00 & 22:00 otomatis nonaktif hari ini:</p>
              <input type="file" id="earlyFile" accept="image/*" onchange="handleEarlyUpload(this)">
              <div id="earlyStatus" style="font-size:12px;color:#fcd34d;font-weight:700">Belum ada SS hari ini</div>
              <img id="earlyImg" class="preview" style="display:none" alt="Bukti SS">
            </div>

            <a class="btn btn-dark" href="https://maganghub.kemnaker.go.id">Buka Portal Monev MagangHub ↗</a>

            <div id="alarmOverlay">
              <div class="modal-box">
                <div style="background:#dc2626;display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:900">SIRINE AKTIF • TIDAK BISA DITUTUP</div>
                <h2 id="alarmTitle" style="margin:10px 0 6px 0;font-size:20px">WAKTUNYA ISI MONEV!</h2>
                <p class="desc">Alarm ini akan terus berbunyi tanpa henti sampai Anda memilih gambar Screenshot (SS) bukti pengisian Monev.</p>
                <a class="btn btn-dark" style="margin-bottom:12px;background:#f59e0b;color:#000" href="https://maganghub.kemnaker.go.id">1. Buka Web Monev & Ambil SS ↗</a>
                <label style="font-size:12px;font-weight:800;color:#fde68a">2. Pilih Gambar Screenshot (SS) Bukti Monev:</label>
                <input type="file" id="modalFile" accept="image/*" onchange="handleModalUpload(this)">
                <img id="modalImg" class="preview" style="display:none" alt="Preview SS">
                <button id="stopBtn" class="btn" style="background:#334155;color:#94a3b8;margin-top:10px" disabled onclick="stopAlarmWithProof()">
                  🔒 PILIH GAMBAR SS DULU UNTUK MEMATIKAN ALARM
                </button>
              </div>
            </div>

            <script>
              const SLOTS = [
                {id:"malam_2000", label:"Alarm Utama • 20:00 WIB", time:"20:00", h:20, m:0, desc:"Berbunyi pukul 8 malam. Hanya berhenti setelah Anda mengunggah SS bukti Monev."},
                {id:"malam_2200", label:"Alarm Terakhir • 22:00 WIB", time:"22:00", h:22, m:0, desc:"Berbunyi pukul 10 malam jika pukul 20:00 belum setor SS bukti Monev."}
              ];
              let sirenTimer = null, audioCtx = null, tempSs = null, fired = {};
              function todayKey(){return new Date().toISOString().slice(0,10);}
              function getLog(){try{return JSON.parse(localStorage.getItem("monev_ss_"+todayKey())||"{}");}catch(e){return {};}}
              function saveLog(d){try{localStorage.setItem("monev_ss_"+todayKey(),JSON.stringify(d));}catch(e){}}
              function beep(){
                try{
                  const C = window.AudioContext || window.webkitAudioContext;
                  if(!C) return;
                  if(!audioCtx) audioCtx = new C();
                  if(audioCtx.state === 'suspended') audioCtx.resume();
                  const now = audioCtx.currentTime;
                  [880, 1174, 880, 1318].forEach((f,i)=>{
                    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                    o.type = 'sawtooth';
                    o.frequency.setValueAtTime(f, now + i*0.2);
                    g.gain.setValueAtTime(0.28, now + i*0.2);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i*0.2 + 0.18);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(now + i*0.2); o.stop(now + i*0.2 + 0.19);
                  });
                  if(navigator.vibrate) navigator.vibrate([400,150,400]);
                }catch(e){}
              }
              function startAlarm(title){
                tempSs = null;
                document.getElementById("alarmTitle").textContent = title || "WAKTUNYA ISI MONEV!";
                document.getElementById("modalFile").value = "";
                document.getElementById("modalImg").style.display = "none";
                const btn = document.getElementById("stopBtn");
                btn.disabled = true;
                btn.style.background = "#334155";
                btn.style.color = "#94a3b8";
                btn.textContent = "🔒 PILIH GAMBAR SS DULU UNTUK MEMATIKAN ALARM";
                document.getElementById("alarmOverlay").style.display = "block";
                if(sirenTimer) clearInterval(sirenTimer);
                beep();
                sirenTimer = setInterval(beep, 1000);
              }
              function handleModalUpload(input){
                const f = input.files && input.files[0];
                if(!f) return;
                const r = new FileReader();
                r.onload = (e) => {
                  tempSs = {name: f.name, time: new Date().toTimeString().slice(0,5)+" WIB", data: e.target.result};
                  const img = document.getElementById("modalImg");
                  img.src = tempSs.data;
                  img.style.display = "block";
                  const btn = document.getElementById("stopBtn");
                  btn.disabled = false;
                  btn.style.background = "#059669";
                  btn.style.color = "#fff";
                  btn.textContent = "✅ SS VALID — MATIKAN ALARM SEKARANG";
                };
                r.readAsDataURL(f);
              }
              function stopAlarmWithProof(){
                if(!tempSs) return;
                if(sirenTimer){ clearInterval(sirenTimer); sirenTimer = null; }
                saveLog(tempSs);
                document.getElementById("alarmOverlay").style.display = "none";
                renderUI();
              }
              function handleEarlyUpload(input){
                const f = input.files && input.files[0];
                if(!f) return;
                const r = new FileReader();
                r.onload = (e) => {
                  saveLog({name: f.name, time: new Date().toTimeString().slice(0,5)+" WIB", data: e.target.result});
                  renderUI();
                };
                r.readAsDataURL(f);
              }
              function renderUI(){
                const log = getLog();
                const hasSs = !!log.data;
                const st = document.getElementById("earlyStatus");
                const eImg = document.getElementById("earlyImg");
                if(hasSs){
                  st.style.color = "#6ee7b7";
                  st.textContent = "✓ Bukti SS tersimpan (" + log.name + " pukul " + log.time + ") — Alarm malam ini aman!";
                  eImg.src = log.data;
                  eImg.style.display = "block";
                } else {
                  st.style.color = "#fcd34d";
                  st.textContent = "Belum ada SS hari ini — Alarm 20:00 & 22:00 Siaga";
                  eImg.style.display = "none";
                }
                document.getElementById("cards").innerHTML = SLOTS.map(s => `
                  <div class="card ${hasSs?'done':''}">
                    <div class="row">
                      <strong style="font-size:13px">${s.label}</strong>
                      <span class="pill ${hasSs?'ok':''}">${hasSs?'✓ Selesai ('+log.time+')':'⏰ Wajib SS'}</span>
                    </div>
                    <div class="time">${s.time} <span style="font-size:13px;color:#94a3b8">WIB</span></div>
                    <p class="desc">${s.desc}</p>
                    <button class="btn ${hasSs?'btn-green':'btn-red'}" onclick="startAlarm('${s.label}')">
                      ${hasSs?'Tes Ulang Alarm ' + s.time:'Bunyikan & Setor SS (' + s.time + ')'}
                    </button>
                  </div>
                `).join("");
              }
              function tick(){
                const now = new Date();
                document.getElementById("clock").textContent = now.toTimeString().slice(0,8) + " WIB";
                let minDiff = Infinity, nextTime = "";
                SLOTS.forEach(s => {
                  const t = new Date(now);
                  t.setHours(s.h, s.m, 0, 0);
                  if(t <= now) t.setDate(t.getDate() + 1);
                  const diff = t - now;
                  if(diff < minDiff){ minDiff = diff; nextTime = s.time; }
                  const key = todayKey() + "_" + s.id;
                  if(now.getHours() === s.h && now.getMinutes() === s.m && now.getSeconds() < 10){
                    if(!fired[key] && !getLog().data){
                      fired[key] = true;
                      startAlarm("🚨 ALARM " + s.time + " WIB — WAJIB SETOR SS!");
                    }
                  }
                });
                const sec = Math.floor(minDiff/1000);
                const hh = String(Math.floor(sec/3600)).padStart(2,"0");
                const mm = String(Math.floor((sec%3600)/60)).padStart(2,"0");
                const ss = String(sec%60).padStart(2,"0");
                document.getElementById("nextTimer").textContent = nextTime + " (-" + hh + ":" + mm + ":" + ss + ")";
              }
              renderUI();
              tick();
              setInterval(tick, 1000);
              if(window.location.search.indexOf("ring=1") !== -1 && !getLog().data){
                startAlarm("🚨 WAKTUNYA ISI MONEV (WAJIB SS)!");
              }
            </script>
          </body>
          </html>
          APK_HTML_EOF
          sed -i 's/^          //' build_apk/assets/index.html

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          PLATFORM_JAR=$(find "$SDK_DIR/platforms" -name "android.jar" | sort -V | tail -n 1)
          AAPT=$(find "$SDK_DIR/build-tools" -name "aapt" | sort -V | tail -n 1)
          D8=$(find "$SDK_DIR/build-tools" -name "d8" | sort -V | tail -n 1)
          ZIPALIGN=$(find "$SDK_DIR/build-tools" -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name "apksigner" | sort -V | tail -n 1)

          javac -source 1.8 -target 1.8 \
            -bootclasspath "$PLATFORM_JAR" \
            -classpath "$PLATFORM_JAR" \
            -d build_apk/classes \
            build_apk/src/id/maganghub/monevreminder/*.java

          "$D8" --lib "$PLATFORM_JAR" --output build_apk/dex build_apk/classes/id/maganghub/monevreminder/*.class

          "$AAPT" package -f \
            -M build_apk/AndroidManifest.xml \
            -A build_apk/assets \
            -I "$PLATFORM_JAR" \
            -F build_apk/unaligned.apk

          zip -j build_apk/unaligned.apk build_apk/dex/classes.dex

          "$ZIPALIGN" -f -p 4 build_apk/unaligned.apk build_apk/aligned.apk

          keytool -genkeypair -v \
            -keystore build_apk/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Monev Alarm,O=MagangHub,C=ID"

          "$APKSIGNER" sign \
            --ks build_apk/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out AlarmMonev_WajibSS_20_22.apk \
            build_apk/aligned.apk

          ls -lh AlarmMonev_WajibSS_20_22.apk

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-AlarmMonev-WajibSS-20-22
          path: AlarmMonev_WajibSS_20_22.apk
